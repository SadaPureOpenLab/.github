<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="450" viewBox="0 0 1500 450" role="img" aria-labelledby="title desc"><title id="title">SadaPure Open Lab</title><desc id="desc">Open tools for transparent ingredients. Public recipe proportions and clear calculations, from Lahore, Pakistan.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#023628"/><stop offset="1" stop-color="#0b4634"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".13"/></filter></defs><rect width="1500" height="450" rx="24" fill="url(#g)"/><path d="M1020-80C780 110 1270 70 1060 290S1150 570 1570 480" fill="none" stroke="#739b65" stroke-opacity=".18" stroke-width="70"/><text x="72" y="143" fill="#fff6dd" font-family="Georgia,serif" font-size="72" font-weight="bold">SadaPure Open Lab</text><text x="76" y="210" fill="#e8efd9" font-family="Arial,sans-serif" font-size="30">Open tools. Clear ingredients.</text><text x="76" y="257" fill="#c6d8bd" font-family="Arial,sans-serif" font-size="22">Practical calculations for everyday food and care.</text><rect x="76" y="315" width="140" height="3" rx="2" fill="#a9cf62"/><text x="76" y="369" fill="#bed3bb" font-family="Arial,sans-serif" font-size="18">Lahore, Pakistan · Built to be inspected and improved</text><g filter="url(#s)" transform="translate(1020 96)"><rect width="355" height="256" rx="18" fill="#f7f8f3"/><text x="25" y="45" font-family="Georgia,serif" font-size="24" fill="#023628">Know your blend.</text><text x="25" y="77" font-family="Arial,sans-serif" font-size="14" fill="#46564b">The published 18-ingredient recipe</text><circle cx="94" cy="164" r="56" fill="none" stroke="#d9c492" stroke-width="25"/><circle cx="94" cy="164" r="56" fill="none" stroke="#0b4634" stroke-width="25" stroke-dasharray="169 352" transform="rotate(-90 94 164)"/><text x="94" y="162" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#023628">100%</text><text x="94" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#46564b">all ingredients</text><text x="190" y="150" font-family="Arial,sans-serif" font-size="17" fill="#023628">48% whole wheat</text><text x="190" y="181" font-family="Arial,sans-serif" font-size="15" fill="#46564b">52% other ingredients</text><text x="25" y="237" font-family="Arial,sans-serif" font-size="11" fill="#46564b">Recipe snapshot · not a clinical or batch certification</text></g></svg>
